<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Renad Pac-Man Tech Journey</title>
  <desc id="desc">An animated Pac-Man travels through a retro maze and eats technology tokens representing Renad's growing tech stack.</desc>

  <style>
    .bg { fill:#0d1117; }
    .frame { fill:none; stroke:#30363d; stroke-width:2; }
    .maze { fill:none; stroke:#1f6feb; stroke-width:4; opacity:.7; }
    .label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size:18px; font-weight:700; fill:#c9d1d9; }
    .small { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size:15px; fill:#8b949e; }
    .token { fill:#161b22; stroke:#30363d; stroke-width:2; }
    .dot { fill:#f2cc60; }
    @media (prefers-color-scheme: light) {
      .bg { fill:#ffffff; }
      .frame { stroke:#d0d7de; }
      .maze { stroke:#0969da; }
      .label { fill:#24292f; }
      .small { fill:#57606a; }
      .token { fill:#f6f8fa; stroke:#d0d7de; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="248" rx="22" class="bg"/>
  <rect x="1" y="1" width="1198" height="248" rx="22" class="frame"/>

  <!-- retro maze -->
  <path class="maze" d="M25 55 H1175 M25 195 H1175 M25 55 V195 M1175 55 V195"/>
  <path class="maze" d="M175 55 V95 H275 V55 M410 195 V155 H505 V195 M660 55 V95 H755 V55 M900 195 V155 H1000 V195"/>

  <text x="40" y="35" class="small">RENAD.EXE  //  tech journey in progress</text>

  <!-- guide dots -->
  <g>
    <circle cx="110" cy="125" r="4" class="dot"/>
    <circle cx="145" cy="125" r="4" class="dot"/>
    <circle cx="180" cy="125" r="4" class="dot"/>
    <circle cx="270" cy="125" r="4" class="dot"/>
    <circle cx="305" cy="125" r="4" class="dot"/>
    <circle cx="395" cy="125" r="4" class="dot"/>
    <circle cx="430" cy="125" r="4" class="dot"/>
    <circle cx="520" cy="125" r="4" class="dot"/>
    <circle cx="555" cy="125" r="4" class="dot"/>
    <circle cx="645" cy="125" r="4" class="dot"/>
    <circle cx="680" cy="125" r="4" class="dot"/>
    <circle cx="770" cy="125" r="4" class="dot"/>
    <circle cx="805" cy="125" r="4" class="dot"/>
    <circle cx="895" cy="125" r="4" class="dot"/>
    <circle cx="930" cy="125" r="4" class="dot"/>
    <circle cx="1020" cy="125" r="4" class="dot"/>
  </g>

  <!-- tech tokens -->
  <g id="t1">
    <rect x="205" y="100" width="65" height="50" rx="10" class="token"/>
    <text x="237.5" y="132" text-anchor="middle" class="label">PY</text>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.13;0.18;0.95;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <g id="t2">
    <rect x="330" y="100" width="65" height="50" rx="10" class="token"/>
    <text x="362.5" y="132" text-anchor="middle" class="label">JS</text>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.25;0.30;0.95;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <g id="t3">
    <rect x="455" y="100" width="65" height="50" rx="10" class="token"/>
    <text x="487.5" y="132" text-anchor="middle" class="label">&lt;/&gt;</text>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.37;0.42;0.95;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <g id="t4">
    <rect x="580" y="100" width="65" height="50" rx="10" class="token"/>
    <text x="612.5" y="132" text-anchor="middle" class="label">SQL</text>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.49;0.54;0.95;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <g id="t5">
    <rect x="705" y="100" width="65" height="50" rx="10" class="token"/>
    <text x="737.5" y="132" text-anchor="middle" class="label">AI</text>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.61;0.66;0.95;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <g id="t6">
    <rect x="830" y="100" width="65" height="50" rx="10" class="token"/>
    <text x="862.5" y="132" text-anchor="middle" class="label">GIT</text>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.73;0.78;0.95;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <g id="t7">
    <rect x="955" y="100" width="95" height="50" rx="10" class="token"/>
    <text x="1002.5" y="132" text-anchor="middle" class="label">DOCKER</text>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.84;0.89;0.95;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- Pac-Man -->
  <g>
    <g>
      <circle cx="0" cy="0" r="27" fill="#f2cc60"/>
      <path d="M0 0 L31 -18 A36 36 0 0 1 31 18 Z" fill="#0d1117">
        <animate attributeName="d"
          values="M0 0 L31 -18 A36 36 0 0 1 31 18 Z;M0 0 L32 -4 A36 36 0 0 1 32 4 Z;M0 0 L31 -18 A36 36 0 0 1 31 18 Z"
          dur="0.45s" repeatCount="indefinite"/>
      </path>
      <circle cx="5" cy="-13" r="3.2" fill="#0d1117"/>
      <animateMotion path="M65 125 H1105" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ghost -->
  <g transform="translate(1110 103)">
    <path d="M0 22 A22 22 0 0 1 44 22 V46 L37 40 L30 46 L22 40 L14 46 L7 40 L0 46 Z" fill="#ff7b72"/>
    <circle cx="14" cy="23" r="6" fill="#fff"/>
    <circle cx="31" cy="23" r="6" fill="#fff"/>
    <circle cx="16" cy="24" r="2.5" fill="#0d1117"/>
    <circle cx="33" cy="24" r="2.5" fill="#0d1117"/>
  </g>

  <text x="600" y="225" text-anchor="middle" class="small">learn  •  build  •  experiment  •  level up  •  repeat</text>
</svg>
